server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker 내부 DNS. 변수로 proxy_pass 하면 요청 때마다 hub-api 주소를 다시 찾는다.
    # 고정 이름으로 쓰면 nginx 기동 시 한 번만 해석해, hub-api 를 다시 만들면 502 가 난다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hub_upstream http://hub-api:8000;

    location /api/ {
        proxy_pass $hub_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 허브 WebSocket (docs/05-ui.md 6장)
    location = /ws {
        proxy_pass $hub_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 봇 응답을 기다리는 동안 이벤트가 뜸해도 끊지 않는다(러너 전체 상한 600초)
        proxy_read_timeout 900s;
    }

    location / {
        try_files $uri /index.html;
    }
}
