server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker 내부 DNS. 변수로 proxy_pass 하면 요청 때마다 hub-api 주소를 다시 찾는다.
    # 고정 이름으로 쓰면 nginx 기동 시 한 번만 해석해, hub-api 를 다시 만들면 502 가 난다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hub_upstream http://hub-api:8000;

    location /api/ {
        proxy_pass $hub_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 허브 WebSocket (docs/05-ui.md 6장)
    location = /ws {
        proxy_pass $hub_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 허브가 Origin 과 Host 를 비교한다(CSWSH 방지). $host 는 포트를 빼서 localhost:8080 이 거절된다
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 봇 응답을 기다리는 동안 이벤트가 뜸해도 끊지 않는다(러너 전체 상한 600초)
        proxy_read_timeout 900s;
    }

    # 휴대폰 워커 → 폰 게이트웨이 (docs/proposals/phone-worker.md 4장). 기기 토큰은 게이트웨이가 검사한다.
    # 게이트웨이의 다른 경로(/rpc·/lease·/events)는 내부망 전용이라 여기서 넘기지 않는다
    location = /phone/ws {
        set $phone_upstream http://phone-gateway:9200;
        proxy_pass $phone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        # 워커 하트비트가 15초라 읽기 제한은 넉넉히
        proxy_read_timeout 120s;
    }

    # 워커 앱 배포(자동 업데이트·QR 설치). 게이트웨이가 기기 토큰 또는 일회용 코드로 검사한다
    location ^~ /phone/apk/ {
        set $phone_apk_upstream http://phone-gateway:9200;
        proxy_pass $phone_apk_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    # 빌드 파일은 이름에 해시가 붙어 오래 캐시해도 된다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 은 매번 새로 확인한다. 캐시되면 배포 뒤에도 예전 화면(예전 번들)이 뜬다
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
