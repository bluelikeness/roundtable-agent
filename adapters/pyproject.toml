[project]
name = "multibot-adapters"
version = "0.1.0"
description = "멀티봇 어댑터 베이스와 Mock 어댑터"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.20",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    # pytest 9 에서는 xdist 3.8 의 --dist loadgroup 이 그룹을 못 붙인다(nodeid 내부 변경). 계약 테스트가 그룹에 기댄다
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "jsonschema>=4.23",
    # mcp 2.x 클라이언트(streamable_http_client)가 받는 HTTP 클라이언트. 계약 테스트가 직접 만든다
    "httpx2>=2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".."]
testpaths = ["tests"]

[tool.uv]
package = false
