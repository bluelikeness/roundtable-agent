# 계약 테스트 전용 오버레이. 허브 웹훅을 기록용 수신기(webhook-sink)로 돌린다.
# make test-adapters 가 docker-compose.yml·override 위에 얹어 쓴다. 경로는 레포 루트 기준.
services:
  webhook-sink:
    build:
      context: ./adapters
      dockerfile: mock/Dockerfile
    command: ["python", "-m", "adapters.testing.webhook_sink"]
    secrets:
      - hub_adapter_token
    ports:
      - "127.0.0.1:9199:8000"
  mock-a:
    environment:
      HUB_WEBHOOK_URL: http://webhook-sink:8000/internal/bot-status
  mock-b:
    environment:
      HUB_WEBHOOK_URL: http://webhook-sink:8000/internal/bot-status
  mock-c:
    environment:
      HUB_WEBHOOK_URL: http://webhook-sink:8000/internal/bot-status
  # Vooy 어댑터 코드를 가짜 기기(adapters/testing/fake_vooy.py)에 붙여 계약 테스트에 올린다.
  # 실제 에뮬레이터·계정은 쓰지 않는다. 실봇 대상(vooy)은 CONTRACT_TARGETS=vooy 로 따로 돌린다(adapters/vooy/README.ko.md)
  vooy-fake:
    build:
      context: ./adapters
      dockerfile: vooy/Dockerfile
    environment:
      ADAPTER_NAME: vooy-fake
      HUB_WEBHOOK_URL: http://webhook-sink:8000/internal/bot-status
      ANDROID_DEVICE_FACTORY: adapters.testing.fake_vooy:FakeVooyDevice
      FAKE_VOOY_DIR: /data/fake-vooy
    secrets:
      - hub_adapter_token
    volumes:
      - vooy-fake-data:/data
    ports:
      - "127.0.0.1:9004:9000"
      - "127.0.0.1:9104:9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:9100/health', headers={'X-Hub-Token': open('/run/secrets/hub_adapter_token').read().strip()}))"]
      interval: 5s
      timeout: 3s
      retries: 20
  # 휴대폰 워커 경로(docs/proposals/phone-worker.md): 봇마다 게이트웨이 + 가짜 휴대폰 + PhoneDevice 경유 어댑터.
  # 계약은 어댑터 하나씩 보므로 가짜 휴대폰을 봇마다 따로 둔다(한 휴대폰을 세 봇이 나눠 쓰는 동작은
  # 단위 테스트 test_three_bots_share_one_phone 이 본다). 기기 토큰은 테스트 전용 값이다(실제 기기 토큰 아님).
  test-phone-gateway:
    build:
      context: ./adapters
      dockerfile: vooy/Dockerfile
    command: ["python", "-m", "adapters.phone"]
    environment:
      PHONE_DEVICE_TOKEN: contract-test-device-token
      PHONE_WATCH_PKGS: com.vooy.mobile,com.pickle.client,com.facebook.aura
    secrets:
      - hub_adapter_token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:9200/state', headers={'X-Hub-Token': open('/run/secrets/hub_adapter_token').read().strip()}))"]
      interval: 5s
      timeout: 3s
      retries: 20
  fake-phone:
    build:
      context: ./adapters
      dockerfile: vooy/Dockerfile
    command: ["python", "-m", "adapters.testing.fake_phone"]
    environment:
      PHONE_GATEWAY_WS: ws://test-phone-gateway:9200/phone/ws
      PHONE_DEVICE_TOKEN: contract-test-device-token
      FAKE_VOOY_DIR: /data/fake-vooy
      FAKE_PHONE_LOCKED: /data/locked
      FAKE_PHONE_DIR: /data
    volumes:
      - fake-phone-data:/data
    depends_on:
      test-phone-gateway:
        condition: service_healthy
  vooy-phone:
    build:
      context: ./adapters
      dockerfile: vooy/Dockerfile
    environment:
      ADAPTER_NAME: vooy-phone
      HUB_WEBHOOK_URL: http://webhook-sink:8000/internal/bot-status
      ANDROID_DEVICE_FACTORY: adapters.phone.device:PhoneDevice
      PHONE_GATEWAY_URL: http://test-phone-gateway:9200
    secrets:
      - hub_adapter_token
    volumes:
      - vooy-phone-data:/data
    ports:
      - "127.0.0.1:9006:9000"
      - "127.0.0.1:9106:9100"
    depends_on:
      - fake-phone
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:9100/health', headers={'X-Hub-Token': open('/run/secrets/hub_adapter_token').read().strip()}))"]
      interval: 5s
      timeout: 3s
      retries: 20
  test-phone-gateway-pickle:
    build:
      context: ./adapters
      dockerfile: vooy/Dockerfile
    command: ["python", "-m", "adapters.phone"]
    environment:
      PHONE_DEVICE_TOKEN: contract-test-device-token
      PHONE_WATCH_PKGS: com.vooy.mobile,com.pickle.client,com.facebook.aura
    secrets:
      - hub_adapter_token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:9200/state', headers={'X-Hub-Token': open('/run/secrets/hub_adapter_token').read().strip()}))"]
      interval: 5s
      timeout: 3s
      retries: 20
  fake-phone-pickle:
    build:
      context: ./adapters
      dockerfile: vooy/Dockerfile
    command: ["python", "-m", "adapters.testing.fake_phone"]
    environment:
      PHONE_GATEWAY_WS: ws://test-phone-gateway-pickle:9200/phone/ws
      PHONE_DEVICE_TOKEN: contract-test-device-token
      FAKE_VOOY_DIR: /data/fake-vooy
      FAKE_PHONE_LOCKED: /data/locked
      FAKE_PHONE_DIR: /data
    volumes:
      - fake-phone-pickle-data:/data
    depends_on:
      test-phone-gateway-pickle:
        condition: service_healthy
  pickle-phone:
    build:
      context: ./adapters
      dockerfile: vooy/Dockerfile
    command: ["python", "-m", "adapters.pickle"]
    environment:
      ADAPTER_NAME: pickle-phone
      HUB_WEBHOOK_URL: http://webhook-sink:8000/internal/bot-status
      ANDROID_DEVICE_FACTORY: adapters.phone.device:PhoneDevice
      PHONE_GATEWAY_URL: http://test-phone-gateway-pickle:9200
    secrets:
      - hub_adapter_token
    volumes:
      - pickle-phone-data:/data
    ports:
      - "127.0.0.1:9009:9000"
      - "127.0.0.1:9109:9100"
    depends_on:
      - fake-phone-pickle
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:9100/health', headers={'X-Hub-Token': open('/run/secrets/hub_adapter_token').read().strip()}))"]
      interval: 5s
      timeout: 3s
      retries: 20
  test-phone-gateway-muse:
    build:
      context: ./adapters
      dockerfile: vooy/Dockerfile
    command: ["python", "-m", "adapters.phone"]
    environment:
      PHONE_DEVICE_TOKEN: contract-test-device-token
      PHONE_WATCH_PKGS: com.vooy.mobile,com.pickle.client,com.facebook.aura
    secrets:
      - hub_adapter_token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:9200/state', headers={'X-Hub-Token': open('/run/secrets/hub_adapter_token').read().strip()}))"]
      interval: 5s
      timeout: 3s
      retries: 20
  fake-phone-muse:
    build:
      context: ./adapters
      dockerfile: vooy/Dockerfile
    command: ["python", "-m", "adapters.testing.fake_phone"]
    environment:
      PHONE_GATEWAY_WS: ws://test-phone-gateway-muse:9200/phone/ws
      PHONE_DEVICE_TOKEN: contract-test-device-token
      FAKE_VOOY_DIR: /data/fake-vooy
      FAKE_PHONE_LOCKED: /data/locked
      FAKE_PHONE_DIR: /data
    volumes:
      - fake-phone-muse-data:/data
    depends_on:
      test-phone-gateway-muse:
        condition: service_healthy
  muse-phone:
    build:
      context: ./adapters
      dockerfile: vooy/Dockerfile
    command: ["python", "-m", "adapters.muse"]
    environment:
      ADAPTER_NAME: muse-phone
      HUB_WEBHOOK_URL: http://webhook-sink:8000/internal/bot-status
      ANDROID_DEVICE_FACTORY: adapters.phone.device:PhoneDevice
      PHONE_GATEWAY_URL: http://test-phone-gateway-muse:9200
    secrets:
      - hub_adapter_token
    volumes:
      - muse-phone-data:/data
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9110:9100"
    depends_on:
      - fake-phone-muse
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:9100/health', headers={'X-Hub-Token': open('/run/secrets/hub_adapter_token').read().strip()}))"]
      interval: 5s
      timeout: 3s
      retries: 20
  vooy:
    environment:
      HUB_WEBHOOK_URL: http://webhook-sink:8000/internal/bot-status

volumes:
  vooy-fake-data:
  vooy-phone-data:
  pickle-phone-data:
  muse-phone-data:
  fake-phone-data:
  fake-phone-pickle-data:
  fake-phone-muse-data:
