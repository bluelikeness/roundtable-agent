# 로컬 개발 전용: 호스트에 포트를 연다. 운영 배포(P5)는 이 파일을 쓰지 않는다.
services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"
  hub-api:
    ports:
      - "127.0.0.1:8000:8000"
  web:
    ports:
      - "127.0.0.1:8080:80"
  # Mock 어댑터: MCP 900x, 관리 HTTP 910x (계약 테스트가 이 포트로 붙는다)
  mock-a:
    ports:
      - "127.0.0.1:9001:9000"
      - "127.0.0.1:9101:9100"
  mock-b:
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9102:9100"
  mock-c:
    ports:
      - "127.0.0.1:9003:9000"
      - "127.0.0.1:9103:9100"
  # Vooy 어댑터(--profile vooy): MCP 9005, 관리 HTTP 9105
  vooy:
    ports:
      - "127.0.0.1:9005:9000"
      - "127.0.0.1:9105:9100"
