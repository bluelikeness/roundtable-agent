# 멀티봇 허브 (VM 1).
# 로컬 개발용 포트 노출은 docker-compose.override.yml 에 있다.
name: multibot

# Mock 어댑터 공통 정의 (docs/03-adapters.md 10장). 이름만 바꿔 여러 개 띄운다.
x-mock-adapter: &mock-adapter
  build:
    context: ./adapters
    dockerfile: mock/Dockerfile
  secrets:
    - hub_adapter_token
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:9100/health', headers={'X-Hub-Token': open('/run/secrets/hub_adapter_token').read().strip()}))"]
    interval: 5s
    timeout: 3s
    retries: 20
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multibot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 가 필요합니다}
      POSTGRES_DB: ${POSTGRES_DB:-multibot}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  hub-api:
    build: ./hub
    environment:
      HUB_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-multibot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multibot}
      HUB_SECRET_KEY: ${HUB_SECRET_KEY:?.env 에 HUB_SECRET_KEY 가 필요합니다}
      HUB_COOKIE_SECURE: ${HUB_COOKIE_SECURE:-true}
      HUB_RUNNER_URL: http://runner:8700
    secrets:
      - hub_adapter_token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Claude Code 러너 (docs/02-architecture.md 4장). 허브만 부른다(내부망, X-Hub-Token).
  # 첫 기동 후 운영자가 직접 로그인한다: docker compose exec -it runner claude auth login
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    secrets:
      - hub_adapter_token
    volumes:
      # Claude Code 로그인 상태만 담는다. 다른 서비스는 마운트하지 않는다
      - runner-claude:/home/runner/.claude
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    # P1-5 전까지는 빈 껍데기: 정적 안내 페이지 + /api 를 허브로 프록시
    build: ./web
    depends_on:
      - hub-api
    restart: unless-stopped

  # 허브·러너를 실제 봇 없이 검증하는 가짜 봇 3개. MCP 9000, 관리 HTTP 9100 (내부망)
  mock-a:
    <<: *mock-adapter
    environment:
      ADAPTER_NAME: mock-a
      HUB_WEBHOOK_URL: http://hub-api:8000/internal/bot-status
    volumes:
      - mock-a-data:/data

  mock-b:
    <<: *mock-adapter
    environment:
      ADAPTER_NAME: mock-b
      HUB_WEBHOOK_URL: http://hub-api:8000/internal/bot-status
    volumes:
      - mock-b-data:/data

  mock-c:
    <<: *mock-adapter
    environment:
      ADAPTER_NAME: mock-c
      HUB_WEBHOOK_URL: http://hub-api:8000/internal/bot-status
    volumes:
      - mock-c-data:/data

# 허브↔어댑터·러너 공유 토큰(X-Hub-Token). 값은 .env 의 HUB_ADAPTER_TOKEN
secrets:
  hub_adapter_token:
    environment: HUB_ADAPTER_TOKEN

volumes:
  pgdata:
  runner-claude:
  mock-a-data:
  mock-b-data:
  mock-c-data:
