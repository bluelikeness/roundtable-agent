# 멀티봇 허브 (VM 1).
# 로컬 개발용 포트 노출은 docker-compose.override.yml 에 있다.
name: multibot

# Mock 어댑터 공통 정의 (docs/03-adapters.md 10장). 이름만 바꿔 여러 개 띄운다.
x-mock-adapter: &mock-adapter
  build:
    context: ./adapters
    dockerfile: mock/Dockerfile
  secrets:
    - hub_adapter_token
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:9100/health', headers={'X-Hub-Token': open('/run/secrets/hub_adapter_token').read().strip()}))"]
    interval: 5s
    timeout: 3s
    retries: 20
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multibot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 가 필요합니다}
      POSTGRES_DB: ${POSTGRES_DB:-multibot}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  hub-api:
    build: ./hub
    environment:
      HUB_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-multibot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multibot}
      HUB_SECRET_KEY: ${HUB_SECRET_KEY:?.env 에 HUB_SECRET_KEY 가 필요합니다}
      HUB_COOKIE_SECURE: ${HUB_COOKIE_SECURE:-true}
      HUB_RUNNER_URL: http://runner:8700
      # 바깥 입구 POST /api/inbox 토큰(비면 닫힘). 피클 등이 방에 의견을 넣을 때 쓴다
      HUB_INBOX_TOKEN: ${HUB_INBOX_TOKEN:-}
    secrets:
      - hub_adapter_token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Claude Code 러너 (docs/02-architecture.md 4장). 허브만 부른다(내부망, X-Hub-Token).
  # 첫 기동 후 운영자가 직접 로그인한다: docker compose exec -it runner claude auth login
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    secrets:
      - hub_adapter_token
    volumes:
      # Claude Code 로그인 상태만 담는다. 다른 서비스는 마운트하지 않는다
      - runner-claude:/home/runner/.claude
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    # 웹 UI(Vite 빌드) + /api·/ws 를 허브로, /phone/ws 를 폰 게이트웨이로 프록시
    build: ./web
    depends_on:
      - hub-api
      - phone-gateway
    restart: unless-stopped

  # 공개 입구(선택): 고정 주소의 HTTPS 를 web 으로. .env 에 PUBLIC_HOST 와 COMPOSE_PROFILES=public 을 두면 켜진다.
  # 공유기에서 바깥 TCP 443 을 이 PC 로 넘겨야 한다. 인증서는 edge-data 볼륨에 남는다.
  edge:
    image: caddy:2.8.4
    profiles: [public]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    ports:
      - "443:443"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - edge-data:/data
    depends_on:
      - web
    restart: unless-stopped

  # 허브·러너를 실제 봇 없이 검증하는 가짜 봇 3개. MCP 9000, 관리 HTTP 9100 (내부망)
  mock-a:
    <<: *mock-adapter
    environment:
      ADAPTER_NAME: mock-a
      HUB_WEBHOOK_URL: http://hub-api:8000/internal/bot-status
    volumes:
      - mock-a-data:/data

  mock-b:
    <<: *mock-adapter
    environment:
      ADAPTER_NAME: mock-b
      HUB_WEBHOOK_URL: http://hub-api:8000/internal/bot-status
    volumes:
      - mock-b-data:/data

  mock-c:
    <<: *mock-adapter
    environment:
      ADAPTER_NAME: mock-c
      HUB_WEBHOOK_URL: http://hub-api:8000/internal/bot-status
    volumes:
      - mock-c-data:/data

  # 폰 게이트웨이 (docs/proposals/phone-worker.md, ADR-9). 휴대폰 워커 앱이 web(nginx)의 /phone/ws 를 거쳐
  # 바깥에서 붙는다(기기 토큰). 어댑터는 내부망 9200 으로 화면 임대·명령·알림을 쓴다(허브 토큰).
  phone-gateway:
    build:
      context: ./adapters
      dockerfile: vooy/Dockerfile
    command: ["python", "-m", "adapters.phone"]
    environment:
      PHONE_WATCH_PKGS: com.vooy.mobile,com.pickle.client,com.facebook.aura,ai.manus.agents
      PHONE_SCREEN_OFF_AFTER_S: ${PHONE_SCREEN_OFF_AFTER_S:-30}
      PHONE_APK_DIR: /srv/phone-dist
    secrets:
      - hub_adapter_token
      - phone_device_token
    volumes:
      # 워커 앱 배포본(phone/release.sh 가 만든다, 레포에 넣지 않음). 자동 업데이트·QR 설치에 쓴다
      - ./phone/dist:/srv/phone-dist:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:9200/state', headers={'X-Hub-Token': open('/run/secrets/hub_adapter_token').read().strip()}))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 실봇 어댑터 3개 (docs/03-adapters.md 7~9장). 사용자 휴대폰의 앱을 폰 게이트웨이 경유로 조종한다.
  # 휴대폰이 연결돼 있지 않거나 잠겨 있으면 available=false(backend_down)로 보고한다.
  vooy:
    <<: &phone-adapter
      build:
        context: ./adapters
        dockerfile: vooy/Dockerfile
      secrets:
        - hub_adapter_token
      depends_on:
        - phone-gateway
      healthcheck:
        test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:9100/health', headers={'X-Hub-Token': open('/run/secrets/hub_adapter_token').read().strip()}))"]
        interval: 5s
        timeout: 3s
        retries: 20
      restart: unless-stopped
    environment:
      HUB_WEBHOOK_URL: http://hub-api:8000/internal/bot-status
      ANDROID_DEVICE_FACTORY: adapters.phone.device:PhoneDevice
      PHONE_GATEWAY_URL: http://phone-gateway:9200
    volumes:
      # 스레드 핸들·하루 전송 수·이미지. 앱 로그인 상태는 휴대폰에 있다
      - vooy-data:/data

  pickle:
    <<: *phone-adapter
    command: ["python", "-m", "adapters.pickle"]
    environment:
      HUB_WEBHOOK_URL: http://hub-api:8000/internal/bot-status
      ANDROID_DEVICE_FACTORY: adapters.phone.device:PhoneDevice
      PHONE_GATEWAY_URL: http://phone-gateway:9200
    volumes:
      - pickle-data:/data

  muse:
    <<: *phone-adapter
    command: ["python", "-m", "adapters.muse"]
    environment:
      HUB_WEBHOOK_URL: http://hub-api:8000/internal/bot-status
      ANDROID_DEVICE_FACTORY: adapters.phone.device:PhoneDevice
      PHONE_GATEWAY_URL: http://phone-gateway:9200
    volumes:
      - muse-data:/data

  cue:
    <<: *phone-adapter
    command: ["python", "-m", "adapters.cue"]
    environment:
      HUB_WEBHOOK_URL: http://hub-api:8000/internal/bot-status
      ANDROID_DEVICE_FACTORY: adapters.phone.device:PhoneDevice
      PHONE_GATEWAY_URL: http://phone-gateway:9200
    volumes:
      - cue-data:/data

# 허브↔어댑터·러너 공유 토큰(X-Hub-Token). 값은 .env 의 HUB_ADAPTER_TOKEN
secrets:
  hub_adapter_token:
    environment: HUB_ADAPTER_TOKEN
  # 휴대폰 워커 기기 토큰. 값은 .env 의 PHONE_DEVICE_TOKEN
  phone_device_token:
    environment: PHONE_DEVICE_TOKEN

volumes:
  pgdata:
  runner-claude:
  mock-a-data:
  mock-b-data:
  mock-c-data:
  vooy-data:
  pickle-data:
  muse-data:
  cue-data:
  edge-data:
