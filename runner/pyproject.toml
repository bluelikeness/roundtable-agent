[project]
name = "roundtable-runner"
version = "0.1.0"
description = "Roundtable-Agent Claude Code 러너"
requires-python = ">=3.12,<3.13"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
package = false
