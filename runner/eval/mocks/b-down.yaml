# 평가 전용 Mock 설정(runner/eval/compose.yml 이 마운트). mock-a/b/c.yaml 이 기본, 나머지는 시나리오 변형
name: mock-b
description: '여행·항공 비서(한국어). 잘하는 일: 항공권·호텔·기차 검색과 가격 비교. 못하는 일: 식당 예약, 쇼핑. 언어: 한국어. 응답 1~3초.'
timeouts:
  quiet_s: 1
mock:
  latency_s:
    min: 1
    max: 3
  fail_rate: 0.0
  needs_input_rate: 0.0
  unavailable_after: 0
  replies:
    동의: 동의합니다. KTX 왕복 + 광안리 근처 숙소(1박 10만원 안팎)면 비용과 동선 모두 무난합니다. 더 반대할 점은 없습니다.
    약점: 비용 면에서 제 안이 낫습니다. 상대 안의 해운대 숙소는 주말엔 1박 20만원 이상으로 올라요. 광안리 횟집 추천은 좋으니 일정에 넣는 걸 권합니다.
    합의: 그 절충안에 찬성합니다. KTX 왕복 + 광안리 근처 숙소(1박 10만원 안팎)면 비용과 동선 모두 무난합니다.
    절충: 그 절충안에 찬성합니다. KTX 왕복 + 광안리 근처 숙소(1박 10만원 안팎)면 비용과 동선 모두 무난합니다.
    쟁점: 그 절충안에 찬성합니다. KTX 왕복 + 광안리 근처 숙소(1박 10만원 안팎)면 비용과 동선 모두 무난합니다.
    부산: 부산 1박은 KTX 왕복(약 12만원)에 서면 숙소(1박 8만원)가 가성비 좋습니다. 1인 총 약 15만원.
    호텔: '요청한 식당 근처 호텔: 1) 강남 호텔A 1박 15만원(도보 3분) 2) 호텔B 1박 12만원(도보 7분).'
    숙소: '요청한 식당 근처 호텔: 1) 강남 호텔A 1박 15만원(도보 3분) 2) 호텔B 1박 12만원(도보 7분).'
    도쿄: '인천→도쿄(나리타) 왕복 최저가: 피치항공 11/20~11/23 238,000원(위탁수하물 별도), 제주항공 265,000원.'
    식당: 여행·항공 전문이라 식당 검색·예약은 못 해요.
    한식: 여행·항공 전문이라 식당 검색·예약은 못 해요.
