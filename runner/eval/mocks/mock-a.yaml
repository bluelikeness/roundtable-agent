# 평가 전용 Mock 설정(runner/eval/compose.yml 이 마운트). mock-a/b/c.yaml 이 기본, 나머지는 시나리오 변형
name: mock-a
description: '식당·예약 비서(한국어). 잘하는 일: 한국 식당 검색, 예약 가능 여부 확인, 예약 진행(예약금 결제 포함). 못하는 일: 항공·호텔·해외 쇼핑. 언어: 한국어. 응답 1~3초.'
timeouts:
  quiet_s: 1
mock:
  latency_s:
    min: 1
    max: 3
  fail_rate: 0.0
  needs_input_rate: 0.0
  unavailable_after: null
  replies:
    동의: 그 수정안에 동의합니다. 광안리 횟집은 토요일 저녁 2인 예약 가능해 보여요. 새로 덧붙일 반대 의견은 없습니다.
    약점: 제 안이 더 낫다고 봅니다. 상대 안은 기차 왕복에 시간이 많이 들고 서면 숙소는 바다와 멀어요. 다만 KTX 가격 정보는 참고할 만합니다.
    합의: 그 절충안이면 받아들일 수 있어요. 숙소는 광안리 근처(1박 10만원 안팎)로 하고 저녁은 광안리 횟집이면 됩니다.
    절충: 그 절충안이면 받아들일 수 있어요. 숙소는 광안리 근처(1박 10만원 안팎)로 하고 저녁은 광안리 횟집이면 됩니다.
    쟁점: 그 절충안이면 받아들일 수 있어요. 숙소는 광안리 근처(1박 10만원 안팎)로 하고 저녁은 광안리 횟집이면 됩니다.
    부산: 부산 1박이면 해운대 숙소(1박 약 13만원)에 저녁은 광안리 횟집을 추천해요. 이동이 적어 편합니다. 1인 총 약 18만원.
    도쿄: 식당·예약 전문이라 항공권 최저가는 정확하지 않아요. 참고로 인천→도쿄 왕복은 보통 25만원 안팎입니다.
    한옥집: 한옥집 내일 19:00 2명 예약 가능합니다. 테라스석, 1인 3만원.
    한식: 강남 한식집 3곳 찾았어요. 1) 한옥집 (테라스, 1인 3만원, 내일 19:00 2명 가능) 2) 밥상 (예약 필수, 19:00 가능) 3) 소반 (웨이팅 많음)
    식당: 강남 한식집 3곳 찾았어요. 1) 한옥집 (테라스, 1인 3만원, 내일 19:00 2명 가능) 2) 밥상 (예약 필수, 19:00 가능) 3) 소반 (웨이팅 많음)
    날씨: 내일 서울 맑음, 최고 14도
